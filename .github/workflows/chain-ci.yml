name: Chain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyyaml jsonschema
      - name: Skill audit
        run: python scripts/skill_audit.py
      - name: Agent registry
        run: python scripts/agent_registry.py
      - name: Self-audit
        run: python scripts/self_audit.py
      - name: Command-template audit
        run: python scripts/command_audit.py --check
      - name: E7 hook smoke
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"git status"}}' | python scripts/safeguard_hook.py
          echo "expected exit 0"
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Chain bench
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/bench_history.py --workspace . --append --kind release
          python scripts/bench_history.py --workspace . --diff
      - name: Upload bench
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-bench
          path: benchmarks/
